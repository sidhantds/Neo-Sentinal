# API on http://localhost:8000/docs and the app on http://localhost:8501
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      NEO_PREDICTION_LOG: /app/logs/predictions.jsonl
    volumes:
      - ./logs:/app/logs

  app:
    build: .
    ports: ["8501:8501"]
    environment:
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    healthcheck:
      disable: true
